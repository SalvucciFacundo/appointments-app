# nginx config for the appointments SPA.
#
# This file is copied into the image as /etc/nginx/templates/default.conf.template.
# The official nginx entrypoint runs envsubst over $BACKEND_UPSTREAM only
# (nginx runtime variables like $uri / $host / $proxy_add_x_forwarded_for are
# NOT in the environment, so envsubst leaves them untouched).
#
# Override the backend target with the BACKEND_UPSTREAM env var, e.g.
#   BACKEND_UPSTREAM=backend:8080   (docker compose default)
#   BACKEND_UPSTREAM=10.0.0.5:8080  (external host)
# The resolved value is a static hostname at config-load time, so nginx does
# not need a `resolver` directive.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy: everything under /api/ is forwarded verbatim to the backend.
    # In Dokploy the proxy can also be configured at application level, but the
    # embedded nginx below is the default and keeps /api working out of the box.
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
